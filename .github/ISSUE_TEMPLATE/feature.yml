name: Feature
description: A bounded, independently verifiable outcome
title: "Feature: "
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome and scope
      description: Problem, in scope, out of scope, and authorization extent.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable success and meaningful failure cases.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Design, dependencies and proof
      description: Link relevant design/specs, prerequisites, risks, environment and documentation impact; omit irrelevant concerns.
    validations:
      required: true
