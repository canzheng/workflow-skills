name: Issue completion labels
on:
  issues:
    types: [closed, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Workflow Issue number to reconcile from its current state
        required: true
        type: string
permissions:
  issues: write
concurrency:
  group: workflow-issue-completion-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      # No checkout, PR code execution or interpolation of Issue bodies.
      - uses: actions/github-script@v7
        with:
          script: |
            const raw = context.payload.issue?.number ?? context.payload.inputs?.issue_number;
            if (!/^[1-9][0-9]*$/.test(String(raw)) || !Number.isSafeInteger(Number(raw))) {
              throw new Error('A positive Issue number is required');
            }
            const target = {...context.repo, issue_number: Number(raw)};
            const phases = ['wf:backlog', 'wf:ready', 'wf:in-progress', 'wf:review'];
            const active = [...phases, 'wf:blocked', 'wf:deferred'];
            const owned = [...active, 'wf:done'];
            const names = issue => issue.labels.map(label => typeof label === 'string' ? label : label.name);
            const marker = body => /<!-- workflow-source: [^\r\n<>]+ -->/.test(body || '');
            const read = async () => (await github.rest.issues.get(target)).data;
            const eventLabels = context.payload.issue ? names(context.payload.issue) : [];
            const ensureLabel = async name => {
              try {
                await github.rest.issues.getLabel({...context.repo, name});
              } catch (error) {
                if (error.status !== 404) throw error;
                try {
                  await github.rest.issues.createLabel({
                    ...context.repo, name,
                    color: name === 'wf:done' ? '0e8a16' : 'ededed',
                    description: name === 'wf:done' ? 'Issue closed as completed' : 'Workflow backlog'
                  });
                } catch (conflict) {
                  if (conflict.status !== 422) throw conflict;
                  // Another Issue's job may have created the same label.
                  await github.rest.issues.getLabel({...context.repo, name});
                }
              }
            };
            const desired = issue => {
              const labels = names(issue);
              if (issue.state === 'closed') {
                if (issue.state_reason === 'completed') return ['wf:done'];
                if (['not_planned', 'duplicate'].includes(issue.state_reason)) return [];
                throw new Error('Closed Issue reason is unknown; inspect before reconciling');
              }
              if (issue.state !== 'open') throw new Error('Unsupported Issue state');
              const present = phases.filter(name => labels.includes(name));
              if (present.length > 1) throw new Error('Multiple workflow phases require manual reconciliation');
              return labels.filter(name => active.includes(name)).concat(present.length ? [] : ['wf:backlog']);
            };
            // Retry against fresh state when a close/reopen or label edit overlaps this job.
            for (let attempt = 0; attempt < 3; attempt++) {
              const issue = await read();
              const labels = names(issue);
              if (issue.pull_request || !(marker(issue.body) || labels.some(name => owned.includes(name)) ||
                  eventLabels.some(name => owned.includes(name)))) {
                core.info('Not a workflow Issue; unchanged');
                return;
              }
              const wanted = desired(issue);
              for (const name of wanted.filter(name => !labels.includes(name))) {
                await ensureLabel(name);
                await github.rest.issues.addLabels({...target, labels: [name]});
              }
              for (const name of labels.filter(name => owned.includes(name) && !wanted.includes(name))) {
                try {
                  await github.rest.issues.removeLabel({...target, name});
                } catch (error) {
                  if (error.status !== 404) throw error;
                  // Only a concurrently removed label is harmless, not an inaccessible Issue.
                  await read();
                }
              }
              const fresh = await read();
              const expected = desired(fresh).sort();
              const actual = names(fresh).filter(name => owned.includes(name)).sort();
              if (JSON.stringify(actual) === JSON.stringify(expected)) {
                core.info(`Reconciled Issue #${target.issue_number}: ${fresh.state}/${fresh.state_reason}`);
                return;
              }
            }
            throw new Error('Issue changed repeatedly; rerun reconciliation from current state');
